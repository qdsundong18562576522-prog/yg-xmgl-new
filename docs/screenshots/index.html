<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>系统截图预览</title>
<style>
body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
h1 { color: #1a365d; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); overflow: hidden; }
.card img { width: 100%; display: block; }
.card .title { padding: 10px 14px; font-size: 14px; font-weight: 600; color: #333; border-bottom: 1px solid #eee; }
</style></head>
<body>
<h1>扬光工程管理系统 - 系统截图</h1>
<div class="grid">
  <div class="card"><div class="title">01 数据看板</div><img src="01_数据看板.png"></div>
  <div class="card"><div class="title">02 项目列表</div><img src="02_项目列表.png"></div>
  <div class="card"><div class="title">03 项目台账列表</div><img src="03_项目台账列表.png"></div>
  <div class="card"><div class="title">04 采购申请列表</div><img src="04_采购申请列表.png"></div>
  <div class="card"><div class="title">05 采购询价列表</div><img src="05_采购询价列表.png"></div>
  <div class="card"><div class="title">06 采购确认列表</div><img src="06_采购确认列表.png"></div>
  <div class="card"><div class="title">07 供货通知列表</div><img src="07_供货通知列表.png"></div>
  <div class="card"><div class="title">08 公司库存</div><img src="08_公司库存.png"></div>
  <div class="card"><div class="title">09 项目库存</div><img src="09_项目库存.png"></div>
  <div class="card"><div class="title">10 材料领用</div><img src="10_材料领用.png"></div>
  <div class="card"><div class="title">11 转库记录</div><img src="11_转库记录.png"></div>
  <div class="card"><div class="title">12 费用申请</div><img src="12_费用申请.png"></div>
  <div class="card"><div class="title">13 费用报销</div><img src="13_费用报销.png"></div>
  <div class="card"><div class="title">14 劳务合同</div><img src="14_劳务合同.png"></div>
  <div class="card"><div class="title">15 劳务签证</div><img src="15_劳务签证.png"></div>
  <div class="card"><div class="title">16 付款申请</div><img src="16_付款申请.png"></div>
  <div class="card"><div class="title">17 项目回款</div><img src="17_项目回款.png"></div>
  <div class="card"><div class="title">18 系统设置</div><img src="18_系统设置.png"></div>
  <div class="card"><div class="title">19 移动端工作台</div><img src="19_移动端工作台.png"></div>
  <div class="card"><div class="title">20 移动端审批</div><img src="20_移动端审批.png"></div>
  <div class="card"><div class="title">21 移动端消息</div><img src="21_移动端消息.png"></div>
  <div class="card"><div class="title">22 移动端我的</div><img src="22_移动端我的.png"></div>
</div>
</body></html>
